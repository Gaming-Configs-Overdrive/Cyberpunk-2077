# Game manifest, see docs/GAME_MANIFEST.md and schema/game.schema.json.
# yaml-language-server: $schema=./schema/game.schema.json
schema: 1
id: cyberpunk-2077
name: Cyberpunk 2077
online: false
stores:
  steam:
    appid: 1091500
  gog:
    id: '1423049311'
  epic:
    appName: Ginger
    catalogItemId: 5beededaad9743df90e8f07d92df153f
detect:
  exe: bin/x64/Cyberpunk2077.exe
processes: [Cyberpunk2077.exe]
files: []
mods:
  # install roots, see docs/CONFIG_PATHS.md
  layout:
    - archive/pc/mod
    - r6/scripts
    - r6/tweaks
    - bin/x64/plugins/cyber_engine_tweaks/mods
    - red4ext/plugins
  items:
    - id: red4ext
      name: RED4ext
      version: '1.31.1'
      source:
        type: github
        repo: WopsS/RED4ext
        url: https://github.com/WopsS/RED4ext/releases/tag/v1.31.1
      license: MIT
      distribute: link
      risk: injector
      notes: Install the Microsoft Visual C++ 2022 Redistributable (x64) first.
    - id: redscript
      name: redscript
      version: '0.5.32'
      source:
        type: github
        repo: jac3km4/redscript
        url: https://github.com/jac3km4/redscript/releases/tag/v0.5.32
      license: MIT
      distribute: link
      notes: This release explicitly adds support for the 2.5 script bundle.
    - id: cyber-engine-tweaks
      name: Cyber Engine Tweaks
      version: '1.38.1'
      source:
        type: github
        repo: maximegmd/CyberEngineTweaks
        url: https://github.com/maximegmd/CyberEngineTweaks/releases/tag/v1.38.1
      license: MIT (v1.38.1)
      distribute: link
      risk: injector
      requires: [red4ext]
      notes: Supports patch 2.5 starting with CET 1.38.0.
    - id: archivexl
      name: ArchiveXL
      version: '1.28.12'
      source:
        type: github
        repo: psiberx/cp2077-archive-xl
        url: https://github.com/psiberx/cp2077-archive-xl/releases/tag/v1.28.12
      license: MIT
      distribute: link
      requires: [red4ext@>=1.31.0]
      notes: Compatible with redscript 0.5.32+.
    - id: tweakxl
      name: TweakXL
      version: '1.12.2'
      source:
        type: github
        repo: psiberx/cp2077-tweak-xl
        url: https://github.com/psiberx/cp2077-tweak-xl/releases/tag/v1.12.2
      license: MIT
      distribute: link
      requires: [red4ext@>=1.31.0]
      notes: Compatible with redscript 0.5.32+.
    - id: codeware
      name: Codeware
      version: '1.21.4'
      source:
        type: github
        repo: psiberx/cp2077-codeware
        url: https://github.com/psiberx/cp2077-codeware/releases/tag/v1.21.4
      license: MIT
      distribute: link
      requires: [red4ext@>=1.31.0]
      notes: Compatible with redscript 0.5.32+ and CET 1.38.0+.
    - id: equipment-ex
      name: Equipment-EX
      version: '1.3.0'
      source:
        type: github
        repo: psiberx/cp2077-equipment-ex
        url: https://github.com/psiberx/cp2077-equipment-ex/releases/tag/v1.3.0
      license: MIT
      distribute: link
      requires:
        [
          archivexl@>=1.28.7,
          tweakxl@>=1.12.1,
          codeware@>=1.21.3,
          redscript@>=0.5.32,
        ]
      optional: true
      notes: Adds wardrobe slots and outfit management.
    - id: native-settings-ui
      name: Native Settings UI
      version: '1.97'
      source:
        type: nexus
        modId: 3518
        url: https://www.nexusmods.com/cyberpunk2077/mods/3518?tab=files
      license: Author permissions (redistribution prohibited)
      distribute: link
      requires: [cyber-engine-tweaks@>=1.38.0]
      optional: true
      notes: Provides an in-game settings menu for supported CET mods.
notes:
  general: >-
    Own engine INI tweaks go into a new .ini file in
    {GAME_DIR}/engine/config/platform/pc/ (the game loads every .ini there);
    never overwrite user.ini. Graphics settings live in UserSettings.json under
    %LOCALAPPDATA%\CD Projekt Red\Cyberpunk 2077 (same for all stores).
